name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=tokyonight&hide_border=false&include_all_commits=true&count_private=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=tokyonight&hide_border=false&include_all_commits=true&count_private=false&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Normalize generated SVGs
        run: |
          perl -pi -e 's/[ \t]+$//' profile/stats.svg profile/top-langs.svg
          perl -0pi -e 's/\s+\z/\n/' profile/stats.svg profile/top-langs.svg

      - name: Upload generated cards
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: readme-stats-cards
          path: profile/*.svg
          if-no-files-found: error
          retention-days: 1

  update:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download generated cards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: readme-stats-cards
          path: profile

      - name: Validate generated cards
        run: |
          test "$(find profile -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 2
          xmllint --noout profile/stats.svg profile/top-langs.svg
          grep -q 'Total Stars Earned' profile/stats.svg
          grep -q 'Most Used Languages' profile/top-langs.svg
          ! grep -Eqi '<(script|foreignObject|image|a|iframe)([ >])|Something went wrong|PAT_1|rate limit' profile/stats.svg profile/top-langs.svg

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub stats cards"
          git push
